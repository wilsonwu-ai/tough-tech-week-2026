<!-- wilson.md brand -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap">
<link rel="stylesheet" href="{{ '/wilson.css' | relative_url }}">
<style>
  body { background: #F5F7FA; color: #14212F; font-family: "Benton Sans", "BentonSans", "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .markdown-body { font-family: "Benton Sans", "BentonSans", "Public Sans", "Helvetica Neue", Arial, sans-serif; color: #14212F; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: #0A2942; }
  .markdown-body h1, .markdown-body h2 { border-bottom-color: #D5DCE5; }
  .markdown-body a { color: #0A2942; }
  .markdown-body code, .markdown-body kbd, .markdown-body pre, .markdown-body tt { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .markdown-body code { background-color: #E6ECF3; color: #14212F; }
  .markdown-body pre, .markdown-body .highlight pre { background-color: #FFFFFF; border: 1px solid #D5DCE5; }
  .markdown-body pre code { background: transparent; }
  .markdown-body blockquote { color: #4C5A6B; border-left-color: #A8481B; }
  .markdown-body table th, .markdown-body table td { border-color: #D5DCE5; }
  .markdown-body table tr { background-color: #F5F7FA; border-top-color: #D5DCE5; }
  .markdown-body table tr:nth-child(2n) { background-color: #FFFFFF; }
  .markdown-body hr { background-color: #D5DCE5; }
  .markdown-body img { background-color: transparent; }
</style>
<!-- /wilson.md brand -->
